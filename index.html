<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tikiku | Receipt Collector</title>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="assets/logo.png" alt="logo" class="brand__img" />
        <div>
          <h1>Receipt Collector</h1>
          <p>Paste screenshots · Arrange on A4 · Print at once</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="receipt-count" id="receiptCount">0 resi</span>
        <button class="button button--secondary" id="clearAllButton" type="button">Hapus semua</button>
        <button class="button button--primary" id="printButton" type="button">Cetak A4</button>
      </div>
    </header>

    <main class="workspace">
      <section class="input-panel" aria-labelledby="inputHeading">
        <div class="input-top">
          <div class="section-heading">
            <h2 id="inputHeading">Input</h2>
            <span>Tekan <kbd>Ctrl</kbd> + <kbd>V</kbd> untuk menempel</span>
          </div>
          <label class="paste-zone" id="pasteZone" for="imageInput" tabindex="0">
            <span class="paste-zone__icon" aria-hidden="true">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-capture"
              >
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 8v-2a2 2 0 0 1 2 -2h2" />
                <path d="M4 16v2a2 2 0 0 0 2 2h2" />
                <path d="M16 4h2a2 2 0 0 1 2 2v2" />
                <path d="M16 20h2a2 2 0 0 0 2 -2v-2" />
                <path d="M9 12a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
              </svg>
            </span>
            <strong>Tempel screenshot resi</strong>
            <span>Ambil screenshot dengan Win + Shift + S, lalu tekan Ctrl + V di halaman ini.</span>
            <span class="paste-zone__browse">Atau pilih gambar dari komputer</span>
          </label>
          <input id="imageInput" class="visually-hidden" type="file" accept="image/*" multiple />
        </div>

        <div class="list-bottom">
          <div class="section-heading">
            <h2>Daftar resi</h2>
            <span>Urutan sesuai waktu ditambahkan</span>
          </div>
          <div id="receiptList" class="receipt-list" aria-live="polite">
            <div class="empty-state">
              <strong>Belum ada resi</strong>
              <span>Screenshot yang ditempel akan muncul di sini.</span>
            </div>
          </div>
        </div>
      </section>

      <section class="preview-panel" aria-labelledby="previewHeading">
        <div class="section-heading">
          <h2 id="previewHeading">Preview A4</h2>
          <span id="previewMeta">2 kolom · otomatis</span>
        </div>
        <div class="paper-stage">
          <div id="printPages" class="print-pages">
            <div class="paper paper--empty">
              <p>Preview cetak akan muncul di sini.</p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <div id="statusMessage" class="status-message" role="status" aria-live="polite"></div>
  </body>
</html>
